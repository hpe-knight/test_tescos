# Kyuubi defaults for the TESCO POC image.
# TBD-TESTING-TEAM: confirm authentication (LDAP/Kerberos?), HA/ZooKeeper,
# and engine share level used in production.

kyuubi.frontend.protocols                 THRIFT_BINARY,REST
kyuubi.frontend.thrift.binary.bind.port   10009
kyuubi.frontend.rest.bind.port            10099

# Local Spark engine for CI testing; production likely uses YARN/K8s master.
kyuubi.engine.type                        SPARK_SQL
kyuubi.engine.share.level                 USER
kyuubi.session.engine.initialize.timeout  PT3M

kyuubi.ha.enabled                         false
