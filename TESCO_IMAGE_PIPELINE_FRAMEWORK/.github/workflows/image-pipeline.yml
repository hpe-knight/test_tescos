# =============================================================================
# TESCO — Docker Image Testing & Scanning Pipeline (self-contained edition)
# Runs GREEN with ZERO secrets configured:
#   - Scanning: Trivy (CVEs + secrets, SARIF) + Dockle (CIS) + Syft (SBOM)
#   - Notifications / S3 archival: activate automatically if configured, else skip
# Stage flow: Build & Lint -> Security Scan -> Quality Gate -> Dynamic Testing
#             -> Reports / Notify / Archive (always)
# =============================================================================
name: Docker Image Testing & Scanning Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_dir:
        description: "Image directory (repo-relative)"
        required: false
        default: "spark-kyuubi-image"
      image_name:
        description: "Image name"
        required: false
        default: "spark-kyuubi"

env:
  IMAGE_NAME: ${{ github.event.inputs.image_name || 'spark-kyuubi' }}
  IMAGE_DIR: ${{ github.event.inputs.image_dir || 'spark-kyuubi-image' }}
  IMAGE_TAG: ${{ github.sha }}

permissions:
  contents: read
  security-events: write     # SARIF -> Security tab
  actions: read

jobs:
  # ===========================================================================
  # STAGE 1 — BUILD & CODE QUALITY
  # ===========================================================================
  build-and-lint:
    name: "Stage 1 — Build & Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ env.IMAGE_DIR }}/Dockerfile
          config: ${{ env.IMAGE_DIR }}/.hadolint.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (layer-cached)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.IMAGE_DIR }}
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Unit tests (TC-U01..TC-U06)
        run: |
          mkdir -p reports/stage1
          bash ${IMAGE_DIR}/tests/unit/run_tests.sh reports/stage1/junit-unit.xml

      - name: Save image for downstream stages
        run: docker save ${IMAGE_NAME}:${IMAGE_TAG} -o image.tar

      - uses: actions/upload-artifact@v4
        with: { name: docker-image, path: image.tar, retention-days: 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: stage1-build-reports, path: reports/stage1/ }

  # ===========================================================================
  # STAGE 2 — SECURITY SCANNING + QUALITY GATE (token-free: Trivy/Dockle/Syft)
  # ===========================================================================
  security-scan:
    name: "Stage 2 — Security Scan & Quality Gate"
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with: { name: docker-image }

      - name: Load image
        run: docker load -i image.tar

      - name: Prepare report directory
        run: mkdir -p reports/stage2

      # -------- Trivy: CVEs (OS + language deps) and embedded secrets --------
      - name: Trivy scan — JSON report
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: json
          output: reports/stage2/trivy-results.json
          scanners: vuln,secret
          exit-code: "0"          # gate decides pass/fail, not the scanner

      - name: Trivy scan — SARIF for GitHub Security tab
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: reports/stage2/trivy-results.sarif
          scanners: vuln,secret
          exit-code: "0"

      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: reports/stage2/trivy-results.sarif
          category: trivy-container

      # -------- Dockle: CIS Docker Benchmark ---------------------------------
      - name: Dockle — CIS benchmark scan
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            goodwithtech/dockle:v0.4.14 --format json \
            "${IMAGE_NAME}:${IMAGE_TAG}" > reports/stage2/dockle-results.json
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            goodwithtech/dockle:v0.4.14 \
            "${IMAGE_NAME}:${IMAGE_TAG}" | tee reports/stage2/dockle-results.txt

      # -------- Syft: SBOM ----------------------------------------------------
      - name: Syft — SBOM (SPDX + CycloneDX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/syft:v1.18.1 "${IMAGE_NAME}:${IMAGE_TAG}" \
            -o spdx-json > reports/stage2/sbom.spdx.json
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/syft:v1.18.1 "${IMAGE_NAME}:${IMAGE_TAG}" \
            -o cyclonedx-json > reports/stage2/sbom.cyclonedx.json

      # -------- Snyk (optional — TESCO's existing tool) -----------------------
      # Uncomment after adding the SNYK_TOKEN secret; Trivy remains primary.
      # - name: Snyk container scan (optional)
      #   uses: snyk/actions/docker@master
      #   continue-on-error: true
      #   env: { SNYK_TOKEN: "${{ secrets.SNYK_TOKEN }}" }
      #   with:
      #     image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
      #     args: --json-file-output=reports/stage2/snyk-results.json

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: stage2-security-reports, path: reports/stage2/ }

      # -------- QUALITY GATE ---------------------------------------------------
      - name: Quality Gate
        run: |
          bash scripts/quality_gate.sh \
            reports/stage2/trivy-results.json \
            reports/stage2/dockle-results.json \
            config/pipeline-config.yml \
            config/allowlist.yml | tee -a "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # STAGE 3 — DYNAMIC TESTING with the enterprise sample dataset
  # ===========================================================================
  dynamic-test:
    name: "Stage 3 — Dynamic Testing"
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with: { name: docker-image }

      - name: Load image
        run: docker load -i image.tar

      - name: Spin up test environment (sample data mounted at /data/sample)
        working-directory: ${{ env.IMAGE_DIR }}
        env:
          TEST_IMAGE: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: docker compose -f docker-compose.test.yml up -d

      - name: Smoke tests (TC-S01..TC-S05)
        run: |
          mkdir -p reports/stage3
          bash ${IMAGE_DIR}/tests/smoke/smoke_test.sh reports/stage3/junit-smoke.xml

      - name: Integration tests (TC-I01..TC-I09)
        run: bash ${IMAGE_DIR}/tests/integration/integration_test.sh reports/stage3/junit-integration.xml

      - name: Collect container logs & tear down
        if: always()
        working-directory: ${{ env.IMAGE_DIR }}
        run: |
          mkdir -p ../reports/stage3
          docker compose -f docker-compose.test.yml logs --no-color \
            > ../reports/stage3/container-logs.txt || true
          docker compose -f docker-compose.test.yml down -v || true

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: stage3-test-reports, path: reports/stage3/ }

  # ===========================================================================
  # REPORTS, NOTIFY & ARCHIVE — always runs; optional integrations auto-skip
  # ===========================================================================
  report-and-notify:
    name: "Reports, Notify & Archive"
    runs-on: ubuntu-latest
    needs: [build-and-lint, security-scan, dynamic-test]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with: { path: all-reports, pattern: "stage*-*" }

      - name: Determine pipeline result
        id: result
        run: |
          S1="${{ needs.build-and-lint.result }}"
          S2="${{ needs.security-scan.result }}"
          S3="${{ needs.dynamic-test.result }}"
          {
            echo "s1=$S1"; echo "s2=$S2"; echo "s3=$S3"
            if [ "$S1$S2$S3" = "successsuccesssuccess" ]; then
              echo "status=PASSED"
            else
              echo "status=FAILED"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Archive reports to S3 / Ceph (skips if not configured)
        if: always()
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
        run: bash scripts/upload_to_s3.sh all-reports "${IMAGE_NAME}" "${IMAGE_TAG}"

      - name: Notify Slack / Teams (skips if not configured)
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          PIPELINE_STATUS: ${{ steps.result.outputs.status }}
          STAGE1_RESULT: ${{ steps.result.outputs.s1 }}
          STAGE2_RESULT: ${{ steps.result.outputs.s2 }}
          STAGE3_RESULT: ${{ steps.result.outputs.s3 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: bash scripts/notify.sh

      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Pipeline Result: ${{ steps.result.outputs.status }}"
            echo ""
            echo "| Stage | Result |"
            echo "|-------|--------|"
            echo "| 1 — Build & Lint | ${{ steps.result.outputs.s1 }} |"
            echo "| 2 — Security Scan & Gate | ${{ steps.result.outputs.s2 }} |"
            echo "| 3 — Dynamic Testing | ${{ steps.result.outputs.s3 }} |"
            echo ""
            echo "Image: \`${IMAGE_NAME}:${IMAGE_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
