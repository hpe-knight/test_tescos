# Stage 3 dynamic-test environment.
# Mounts the enterprise sample dataset read-only at /data/sample so the
# integration tests can exercise real CSV ingestion + SQL analytics.
# Local use:  TEST_IMAGE=spark-kyuubi:local docker compose -f docker-compose.test.yml up -d

services:
  kyuubi:
    image: ${TEST_IMAGE:-spark-kyuubi:local}
    container_name: kyuubi-test
    ports:
      - "10009:10009"   # Thrift / JDBC
      - "10099:10099"   # REST + /api/v1/ping health endpoint
    volumes:
      - ./sample-data:/data/sample:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:10099/api/v1/ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
